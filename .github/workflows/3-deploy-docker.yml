# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Lab 3 - Test, build image and deploy container to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGE: ${{ vars.DOCKERHUB_USERNAME }}/flask-cicd-demo

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -v

  build-and-push:
    # Removed 'needs: test' so this runs in parallel with the test job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}

  deploy:
    # Kept 'needs: build-and-push' so it waits for the image to exist
    # Added 'test' so it still won't deploy broken code if tests fail
    needs: [test, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - name: Pull and run the new container on EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          script: |
            set -e
            IMAGE=${{ env.IMAGE }}:${{ github.sha }}
            docker pull "$IMAGE"
            docker rm -f flask-app || true
            docker run -d --name flask-app --restart unless-stopped \
              -p 80:5000 "$IMAGE"
            sleep 5
            curl --fail http://localhost/health
            docker image prune -f
